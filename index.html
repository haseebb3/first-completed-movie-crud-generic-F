  <div class="container">
    <div class="model d-none" id="model">
      <div class="row">
        <div class="col-md-12">
          <form id="movieForm">
            <div class="card">
              <div class="card-header d-flex justify-content-between">
                <h3 id="movieAddOrUpdate">Add Movie Details</h3>
                <i role="button" class="fa-solid fa-xmark fa-2x text-danger close-model"></i>
              </div>

              <div class="card-body">
                <div class="form-row">
                  <div class="col-md-4 form-group">
                    <label for="title">Movie Name</label>
                    <input required type="text" id="title" class="form-control" />
                  </div>
                  <div class="col-md-4 form-group">
                    <label for="genre">Movie Genere</label>
                    <select required id="genre" class="form-control text-primary">
                      <option value="" disabled selected hidden>
                        Choose Genere
                      </option>
                      <option value="Action">Action</option>
                      <option value="Science Fiction (Sci-Fi)">
                        Science Fiction (Sci-Fi)
                      </option>
                      <option value="Comedy">Comedy</option>
                      <option value="Drama">Drama</option>
                      <option value="Thriller">Thriller</option>
                      <option value="Animation">Animation</option>
                    </select>
                  </div>
                  <div class="col-md-4 form-group">
                    <label for="releaseDate">Movie Release Date</label>
                    <input type="date" id="releaseDate" class="form-control text-primary" />
                  </div>
                  <div class="col-md-6 form-group">
                    <label for="poster">Movie Image</label>
                    <input required type="url" id="poster" class="form-control" />
                  </div>
                  <div class="col-md-6 form-group">
                    <label for="rating">Movie Rating</label>
                    <select required id="rating" class="form-control">
                      <option value="1">1</option>
                      <option value="2">2</option>
                      <option value="3">3</option>
                      <option value="4">4</option>
                      <option value="5">5</option>
                      <option value="6">6</option>
                      <option value="7">7</option>
                      <option value="8">8</option>
                      <option value="9">9</option>
                      <option value="10">10</option>
                    </select>
                  </div>
                  <div class="col-12 form-group">
                    <label for="description">Movie Description</label>
                    <textarea placeholder="Movie Description" id="description" rows="4" class="form-control"></textarea>
                  </div>
                </div>
              </div>
              <div class="card-footer d-flex justify-content-between">
                <button class="btn btn-sm sec-btn" id="addMovBtn">
                  Add Movie
                </button>
                <button type="button" class="btn btn-sm sec-btn d-none" id="updateMovBtn">
                  Update Movie
                </button>
                <button type="button" class="btn btn-sm pri-btn close-model">
                  Cancel
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="backdrop close-model d-none" id="backDrop"></div>

  <div class="d-none" id="spinner">
    <button class="btn btn-primary" type="button" disabled>
      <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      Loading...
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
